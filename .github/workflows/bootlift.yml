name: Spring Boot 4 readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  bootlift:
    name: Bootlift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: GabrielRossi01/bootlift@main
        with:
          fail-on: error
